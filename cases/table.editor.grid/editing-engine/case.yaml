feature: table.editor.grid
intent: >-
  The engine gives the grid the records an edit touches without the page holding the table:
  gridRecords answers the records of some ids in the order asked, with their row keys (what
  writes name), only the fields asked for when some are named (none for the row keys alone), and
  leaves out ids that name no record of the table; an ask without a table or ids is refused.
