format: 1
id: regressions/issue-footer-count-plural
feature: table.editor.grid
intent: >-
  The grid's footer counts agree with their number in every locale, by i18next's plural keys and
  the locale's plural rules: one record reads "1 record" (not "1 records"), "1 registro",
  "1 enregistrement"; one selected record "1 seleccionado", "1 sélectionné", "1 selecionado".
  Russian names the count as a label ("Записей: 1") and Chinese has no plural, so their one string
  serves every number.
