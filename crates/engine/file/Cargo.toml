[package]
name = "kition-table-file"
description = "The .ktable table document format: a self-contained SQLite file with tables, fields, views, records, links, and history."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
kition-kdm = { workspace = true }
kition-time = { workspace = true }

flate2 = { workspace = true }
rusqlite = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[features]
# Counted ids for tests and sample builds (src/ids.rs, `KITION_REPRODUCIBLE_IDS`), with the KDM's
# own: enable it in `[dev-dependencies]` only, never in a shipped build.
reproducible-ids = ["kition-kdm/reproducible-ids"]

[dev-dependencies]
tempfile = { workspace = true }
# The crate's own tests count ids when they ask for it (tests/reproducible_ids.rs).
kition-table-file = { path = ".", features = ["reproducible-ids"] }

# Browsers have no OS randomness: ids draw theirs from `crypto.getRandomValues`.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
uuid = { workspace = true, features = ["js"] }
