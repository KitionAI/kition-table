format: 1
id: regressions/issue-9
feature: table.schema
intent: An explicit table or field name is kept as given, or refused. table.add (name, fields[i].name) and field.add (name) answer invalid_params with one data.errors entry per name the engine would have rewritten, at /name or /fields/<i>/name, and the call writes nothing. Such a name is one not in internal-name form (^[a-z](?:[a-z0-9_]*[a-z0-9])?$) or one already taken, also by an earlier field of the same call. Names derived from titles stay as before, and the params schemas and agent/guide.md state the rule. Before, kition-table 0.2.18 silently rewrote "电话x" to x and a second "name" to name_2, so a host wrote into a different field than it meant.
layer: gate
source:
  kind: issue
  from: Kition Table regression suite
  license: owned
input: []
steps:
  - exec:
      cmd: [cargo, test, -q, -p, kition-table, --test, field_names]
expected:
