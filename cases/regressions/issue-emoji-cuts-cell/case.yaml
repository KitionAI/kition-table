format: 1
id: regressions/issue-emoji-cuts-cell
feature: table.picture
intent: >-
  An emoji drawn over a cell leaves the cell opaque: a color glyph's layers are composed as one
  group, which then goes over what is below. Before, a glyph layer with a composite mode such as
  Src or DestIn acted on the cell under it, so the picture had see-through pixels inside an
  emoji's box (found by the grid's layout test drawing "季度 plan" with a rocket).
