format: 1
id: table.editor.grid/display-raster
feature: table.editor.grid
intent: >-
  The headless player of the display list (vello_cpu) draws every op where the format puts it:
  snapped rectangles and tofu boxes on whole device pixels, hairlines one device pixel thick at
  device pixel ratios 1, 1.5 and 2, rounded boxes, inside borders, shadows, clips, solid and
  outline icons equal to the tile the page will draw at the box's snapped corner, images by fit
  (a placeholder when undecoded), text from its anchor on its baseline in its one face with the
  baseline on a device pixel row, and emoji equal to the tile the page will draw. A decoded list
  draws the same pixels as the original. A cover-cropped picture keeps its middle: a picture four
  times as wide as tall, red then blue, covers a square box red left of its centre and blue right.
