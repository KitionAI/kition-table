format: 1
id: regressions/issue-inspect-content
feature: table.agent.observe
intent: >-
  table_inspect answers the file's content with the addresses the commands take (KHP A52, A46,
  A47): every table with its fields (ids, names, labels, types, select choices, link targets), its
  views (filter, sorts and groups by field name), its record count and its first records under
  their field names with their record ids, a link's records by record id; at most 20 records a
  table and 100 in all, with the file.read step that lists the rest a page at a time, of a table
  or of a view (A24a, A25). An edit (a field renamed, a record changed) changes the answer and
  survives a save and a reopen. Before, the headless kit answered {"tables": [{"id": 1}]}, so the
  agent-ready self-test found an edit invisible and an agent had to guess.
layer: gate
source:
  kind: probe
  from: agent-readiness review of the table kit, the SDK self-test's act phase
  license: owned
input: []
steps:
  - cargo-test: { package: kition-table, test: inspect }
expected:
  - actual: out:exit
    compare: exit
    value: 0
since: "2026-11-16"
