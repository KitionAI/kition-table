format: 1
id: table.editor.grid/edit-perf
feature: table.editor.grid
intent: >-
  Editing the grid stays quick on a table of 100,000 records in 50 fields (the grid design, section
  4.2, scenario g): on the development page, at a device pixel ratio of 2, 50 cells edited one
  after another (a typed value, then Enter) are each written and redrawn, from the Enter to the
  first frame that shows the value, within the edit-to-redraw line (p95 50 ms on the owner's
  machine; the headless run relaxes it by the scroll lines' factor); and a whole number column of
  the 100,000 records cleared with Delete, the clear undone and redone with the page's Undo and
  Redo, then the column pasted (one line for each record) and filled down from its first cell, is
  each time written and redrawn, every record holding what was written (after the undo, what it
  held before the clear).
layer: corpus
dimension: performance
