format: 1
id: regressions/issue-room-snapshot-ignored
feature: table.collab.replica
intent: >-
  A co-editing host stores the room's snapshot as the replica a table opens with (the embed's
  adoptRoom), so a fresh page after a restart opens with every change the room acknowledged.
  `openWithReplica` with file bytes opens on a snapshot of the file's own document (the file's
  state written over it when they differ); a snapshot that holds the file's state leaves the
  document saved, and a damaged one is left out. (A room's changes the file lacks are no longer
  merged in: the file's content wins, kition-sdk 91cf510.)
  Before, file bytes opened as the file alone and the stored snapshot was ignored, so the
  editor showed the last saved file until the relay caught up.
layer: gate
source:
  kind: issue
  from: "co-editing cases: table keeps no replica the room can use"
  license: owned
input: []
steps:
  - cargo-test: { package: kition-table-kit, filter: "tests::file_bytes_open_saved_with_the_replica_saved_with_them" }
  - cargo-test: { package: kition-table-kit, filter: "tests::a_damaged_snapshot_leaves_the_file_as_it_is" }
expected:
  - actual: out:exit
    compare: exit
since: "2026-11-16"
