[workspace]
resolver = "3"
members = ["crates/*/*", "bindings/*", "apps/*"]

[workspace.package]
version = "0.1.2"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/KitionAI/kition-table"
publish = false

[workspace.dependencies]
# internal
kition-time = { path = "crates/engine/time" }
kition-table-file = { path = "crates/engine/file" }
kition-table-api = { path = "crates/engine/api" }
kition-table-arrange = { path = "crates/engine/arrange" }
kition-table-ai = { path = "crates/engine/ai-field" }
kition-table-import = { path = "crates/formats/import" }
kition-table-fonts = { path = "crates/view/fonts" }
kition-table-display = { path = "crates/view/display" }
kition-table-grid = { path = "crates/view/grid" }
kition-table-picture = { path = "crates/view/picture" }

# kition-sdk, pinned by commit (one revision for every crate of it): the kit contract, the headless
# host, and the Kit Data Model.
kition-kit = { git = "https://github.com/KitionAI/kition-sdk", rev = "82a32241d0159371ebaeb9cb88df5e071c3db1a7" }
kition-headless = { git = "https://github.com/KitionAI/kition-sdk", rev = "82a32241d0159371ebaeb9cb88df5e071c3db1a7" }
kition-kdm = { git = "https://github.com/KitionAI/kition-sdk", rev = "82a32241d0159371ebaeb9cb88df5e071c3db1a7" }
# The Kit Protocol server types: the headless executable's `document.identity` error, and what the
# headless tests drive.
kition-kit-server = { git = "https://github.com/KitionAI/kition-sdk", rev = "82a32241d0159371ebaeb9cb88df5e071c3db1a7" }
# The Kition platform convergence suite (L6), on the same kition-sdk revision (tests only).
kition-convergence = { git = "https://github.com/KitionAI/kition-sdk", rev = "82a32241d0159371ebaeb9cb88df5e071c3db1a7" }
# A host of kit processes (`HeadlessKit`), for the `document.identity` tests (tests only).
kition-kit-host = { git = "https://github.com/KitionAI/kition-sdk", rev = "82a32241d0159371ebaeb9cb88df5e071c3db1a7" }
# The kits' MCP tools (`kition-kits-mcp`'s library), for the end-to-end agent tests (tests only).
kition-kits = { git = "https://github.com/KitionAI/kition-sdk", rev = "82a32241d0159371ebaeb9cb88df5e071c3db1a7" }
kition-env = { git = "https://github.com/KitionAI/kition-sdk", rev = "82a32241d0159371ebaeb9cb88df5e071c3db1a7" }

# Tessera's icons (the editor's own), as SVG path data the picture strokes; pinned by commit.
kition-tessera-icons = { git = "https://github.com/KitionAI/kition-tessera", rev = "832f61a5e4b4ac1a5083620bfdeeb92a86560694" }

# foundation
base64 = "0.22"
calamine = { version = "0.30", features = ["dates"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
csv = "1"
# The preview's PNG (`table.file.render`), the version kition-headless already brings.
png = "0.17"
# The headless picture's attachment thumbnails (with png): JPEG and WebP decoders.
zune-jpeg = "0.5"
zune-core = "0.5"
image-webp = "0.2"
# GIF attachments: the first frame.
gif = "0.14"
# SVG attachments, drawn by resvg (usvg's tree, tiny-skia's pixels); no text or embedded pictures.
resvg = { version = "0.50", default-features = false }
# HEIC/HEIF attachments: a pure-Rust decoder (MIT OR Apache-2.0), pinned exactly: a young crate that
# parses untrusted files, so moving the pin is a reviewed change.
heic-rs = { version = "=0.1.4", default-features = false }
js-sys = "0.3"
regex = "1"
rusqlite = { version = "0.38", features = ["backup", "blob", "bundled", "hooks", "serde_json", "serialize"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
# The picture: shaping, outlines, paths and the CPU renderer, as kition-note draws.
skrifa = "0.47"
harfrust = "0.13"
kurbo = "0.13"
vello_cpu = { version = "0.2", default-features = false, features = ["std", "u8_pipeline"] }
tempfile = "3"
thiserror = "2"
tracing = "0.1"
url = "2"
# Line breaks (UAX #14) of the grid's wrapped text, as kition-note and kition-doc break.
unicode-linebreak = "0.1"
uuid = { version = "1", features = ["v4", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 0

# The engine's property and projection suites are slow unoptimized.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
