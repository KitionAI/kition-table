format: 1
id: table.editor.grid/layout-cells
feature: table.editor.grid
intent: >-
  The grid is laid out in Rust in the editor's geometry: a row head of its controls (72 px with a
  drag handle, 48 px when the view sorts or groups), a 32 px header row with each field's lock,
  type icon, title and menu caret, rows of 32, 40, 56 or 88 px, 48 px group headers with their
  toggle, title and value, a 32 px add row after the records or after each group (numbers
  restart in each group), a 100 px add-field column, and the frozen columns' divider. Each cell
  kind lays out as the editor's: text centred, wrapped to the row's lines and cut with an
  ellipsis 1 px short of its room; runs of one face each (Inter, Droid Sans Fallback, Nanum
  Gothic), emoji as EMOJI ops, characters no face covers as TOFU boxes; checkboxes, choice chips
  in their tones, rating symbols, people, attachments (pictures and files) and buttons, with
  their hit parts; and the focus outline. A cut is the longest prefix that fits (as halving the
  text finds it), a draft shaper cuts to its room too and leaves emoji out, and the shaping cache
  keeps what was used lately. A centred one-line value is anchored at its cell's horizontal centre
  at every column width. Checked as structure, not pixels.
