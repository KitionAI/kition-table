format: 1
id: regressions/issue-7
feature: table.records
intent: >-
  A reproducible build (SOURCE_DATE_EPOCH set, as the showcase and golden cases run) saves the
  same .ktable bytes every time the same commands build it: the document, record, table, field,
  view, link and dashboard ids, the replica's actor and the editor's filter nodes come from a
  counter hashed with the epoch, and every stored time is the epoch. Before, row keys were random
  UUIDs, times were the clock's, and a JSON value's keys were encoded in a per-process hash order,
  so every save differed. Without SOURCE_DATE_EPOCH ids stay random.
layer: golden
source:
  kind: issue
  from: Kition Table regression suite
  licence: owned
input: []
steps:
  - cargo-test: { package: kition-table-kit, test: deterministic_save }
expected:
  - actual: out:exit
    compare: exit
since: "2026-11-16"
