format: 1
id: table.file.content-only/no-history
feature: table.file.content-only
intent: >-
  A saved .ktable holds the table's content, not its history: its replica is the sealed content
  snapshot (one change, the seal) with no change row, and no byte of the file holds deleted or
  overwritten content; an unchanged table saves the same bytes; the file opened alone keeps its
  document id and object ids and edits; it converges with a replica that has the whole history;
  undo after a save takes back the last edit; an unsealed save seals a copy; a file opens on the
  replica a host stored; an agent's headless run saves sealed content.
layer: gate
source:
  kind: synthetic
  from: kition-sdk data model 7.3 (rule M16b)
  license: owned
input: []
steps:
  - cargo-test: { package: kition-table-kit, filter: "the_file_holds_the_content_and_of_the_history_only_the_seal" }
  - cargo-test: { package: kition-table-kit, filter: "an_unchanged_table_saves_to_the_same_bytes" }
  - cargo-test: { package: kition-table-kit, filter: "a_file_opened_alone_is_the_same_document_with_its_ids_and_edits" }
  - cargo-test: { package: kition-table-kit, filter: "a_replica_from_the_file_and_one_with_the_whole_history_converge" }
  - cargo-test: { package: kition-table-kit, filter: "undo_after_a_save_takes_back_the_last_edit" }
  - cargo-test: { package: kition-table-kit, filter: "a_save_nobody_sealed_for_seals_a_copy_and_mark_saved_takes_the_seal_in" }
  - cargo-test: { package: kition-table-kit, filter: "a_file_opens_on_the_replica_a_host_stored_by_its_changes_or_by_its_state" }
  - cargo-test: { package: kition-table, filter: "an_agent_run_saves_sealed_content" }
expected:
  - actual: out:exit
    compare: exit
since: "2026-11-23"
