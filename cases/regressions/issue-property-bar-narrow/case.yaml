id: regressions/issue-property-bar-narrow
feature: table.editor.toolbar
intent: >-
  In a 768 px kit pane (a 1024 px Kition window beside its sidebar) the grid toolbar keeps
  "Search records" in view: its menu buttons show as icons, named by title and aria-label, since
  their menus open inline and a scrolling bar would clip them. Undo and Redo are the editor
  frame's alone; the toolbar no longer adds a second pair beside them.
