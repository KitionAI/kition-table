format: 1
id: regressions/issue-3
feature: table.agent.act
intent: >-
  A host that turns the kit's commands into tools reads, for every command in commands.list, the
  kit's description and an output schema (KHP A1) whose `result` is typed and names every key the
  command really answers, nested as the answer is: the route's answer in `result`, beside
  `change` (what the call changed, or null). Before, 18 commands answered an untyped "route's
  answer" and the typed ones left out most keys (ids, order, timestamps), and descriptions named
  things the commands do not do (record counts, form views, a view's filters in records.list).
layer: golden
source:
  kind: issue
  from: Kition Table regression suite
  licence: owned
input: []
steps:
  - cargo-test: { package: kition-table, test: command_catalogue }
  - cargo-test: { package: kition-table-kit, filter: "match_their_schemas" }
expected:
  - actual: out:exit
    compare: exit
since: "2026-11-16"
