format: 1
id: regressions/issue-render-command
feature: table.picture
intent: >-
  The headless kit's preview follows the render contract (Kition platform K21, KHP A39, A24):
  kit.json declares agent.render table.file.render, which takes scale (up to 2), maxSize, target
  (a diagnostic's path or sheet, a table, a view, and a range of its rows) and slide, and answers a
  top-level base64 png, drawn with the faces the executable embeds, equal to conformance/golden.
  Before, table.preview.render answered {change, result: {png}}, took focus, and was not declared,
  so the kits server previewed with the screenshot (no scale, no target), and the executable drew
  no text unless its host set KITION_FONTS_DIR, which the kits server does not.
layer: golden
source:
  kind: probe
  from: agent-readiness review of the table kit's preview
  licence: owned
input: []
steps:
  - cargo-test: { package: kition-table, test: render }
expected:
  - actual: out:exit
    compare: exit
    value: 0
since: "2026-11-16"
