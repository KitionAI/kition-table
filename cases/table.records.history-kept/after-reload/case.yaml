format: 1
id: table.records.history-kept/after-reload
feature: table.records.history-kept
intent: >-
  A record's history survives closing the document. The saved .ktable holds no history and the
  host keeps no changes, only a snapshot per checkpoint; records.history tells what came before
  the session from the differences between consecutive checkpoints, each at the later one's time
  and by its author (coarser than change by change: several changes between two checkpoints show
  as one, and what came after the newest checkpoint has no time or author); a file opened alone,
  or a document without checkpoints, tells nothing before its session. In the editor under the
  development host (replica and checkpoints), edits saved and reloaded keep their history and
  author.
layer: gate
source:
  kind: synthetic
  from: kition-sdk Kit UI protocol 7 and 7m, data model 7.3
  license: owned
input: []
steps:
  - cargo-test: { package: kition-table-kit, filter: "a_record_keeps_its_history_and_author_through_the_stored_replica" }
  - cargo-test: { package: kition-table-kit, filter: "two_sessions_saved_and_reopened_keep_both_edits_and_their_authors" }
  - cargo-test: { package: kition-table-kit, filter: "a_checkpoint_dates_the_changes_it_holds" }
expected:
  - actual: out:exit
    compare: exit
since: "2026-11-24"
